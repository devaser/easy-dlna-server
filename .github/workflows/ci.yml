name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python syntax
        run: python -m compileall -q .

      - name: Shell script syntax
        run: |
          bash -n packaging/linux/build-deb.sh
          bash -n packaging/macos/build-pkg.sh
          for script in packaging/linux/debian/postinst packaging/linux/debian/prerm packaging/linux/debian/postrm; do
            sh -n "$script"
          done

      - name: Versions match
        run: python packaging/check_version.py

      - name: Run the server from source
        run: |
          python -m pip install -r requirements.txt
          python easydlna.py --version
          python easydlna.py run > run.log 2>&1 &
          pid=$!
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8200/health && break
            sleep 1
          done
          curl -fsS http://localhost:8200/health
          kill "$pid"
          wait "$pid" || true
          cat run.log
